[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sublime-titler"
version = "0.2.1"
description = "Burn gorgeous karaoke-style subtitles into any video"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "sublime-titler contributors" }]
keywords = ["subtitles", "karaoke", "ass", "srt", "ffmpeg", "video", "tts"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Graphics :: Presentation",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1.1"]
gpu = ["faster-whisper>=1.1.1", "nvidia-cublas-cu12", "nvidia-cudnn-cu12"]
dev = ["pytest"]

[project.scripts]
sublime-titler = "sublime_titler.cli:main"

[tool.setuptools]
packages = ["sublime_titler"]

[tool.setuptools.package-data]
sublime_titler = []